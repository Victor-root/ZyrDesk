<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">ZyrDesk</title>
  <desc id="desc">Deux écrans superposés, blanc et or, représentant une connexion à distance.</desc>

  <!--
    Deux écrans strictement identiques, décalés sur une diagonale.
    Les cadres restent massifs pour conserver leur forme à 16 px.
  -->

  <!-- Écran distant — blanc. -->
  <rect x="118" y="70" width="328" height="246" rx="68" fill="#FFFFFF" stroke="#090D16" stroke-width="28"/>
  <rect x="182" y="134" width="200" height="118" rx="24" fill="#090D16"/>

  <!-- Écran local — or, au premier plan. -->
  <rect x="66" y="196" width="328" height="246" rx="68" fill="#EFB536" stroke="#090D16" stroke-width="28"/>
  <rect x="130" y="260" width="200" height="118" rx="24" fill="#090D16"/>

</svg>
