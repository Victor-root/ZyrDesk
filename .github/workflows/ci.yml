name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  qualite:
    name: Format et analyse statique
    runs-on: ubuntu-latest
    steps:
      # Les moteurs sont des submodules volumineux et inutiles ici.
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Installer de quoi compiler l'interface
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # L'interface s'appuie sur la couche web du système. Sous Windows
      # elle est déjà là ; sous Linux elle s'installe, et sans elle la
      # compilation de l'espace de travail entier s'arrête.
      - name: Installer de quoi compiler l'interface
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      # Sans --no-fail-fast, cargo s'arrête au premier binaire de test en
      # échec : une plateforme qui casse plusieurs choses ne les révèle
      # qu'une par une, un aller-retour de CI à chaque fois.
      - run: cargo test --workspace --all-targets --no-fail-fast
      - name: Diagnostic
        run: cargo run -p zyr-cli -- doctor

  installateur:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NSIS n'est plus fourni par l'image Windows du runner, et son
      # installateur n'ajoute rien au PATH.
      #
      # Où il se pose n'est pas écrit d'avance : le paquet livre tantôt
      # la version 32 bits, tantôt la 64, et les deux ne s'installent pas
      # au même endroit. Le chemin était écrit en dur ici, et le jour où
      # le paquet a changé de bord, la compilation s'est arrêtée sur un
      # « makensis introuvable » alors que NSIS venait d'être installé.
      # Cherché plutôt qu'écrit, et dit franchement s'il manque.
      - name: Installer NSIS
        run: |
          choco install nsis --no-progress -y
          $ou = Get-ChildItem -Path "C:\Program Files\NSIS", "C:\Program Files (x86)\NSIS" `
            -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ou) { throw "makensis introuvable après l'installation de NSIS" }
          $ou.DirectoryName >> $env:GITHUB_PATH
      - run: cargo build --release --workspace
      # Les guillemets ne sont pas décoratifs : sans eux, PowerShell coupe
      # -DVERSION=0.1.0 en deux arguments et makensis cherche un script
      # nommé « .1.0 ».
      - name: Construire l'installateur
        working-directory: packaging/windows
        run: makensis "-DVERSION=0.1.0" zyrdesk-setup.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: zyrdesk-setup
          path: packaging/windows/ZyrDesk-Setup-*.exe
          if-no-files-found: error
