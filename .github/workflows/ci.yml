name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  qualite:
    name: Format et analyse statique
    runs-on: ubuntu-latest
    steps:
      # Les moteurs sont des submodules volumineux et inutiles ici.
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Sans --no-fail-fast, cargo s'arrête au premier binaire de test en
      # échec : une plateforme qui casse plusieurs choses ne les révèle
      # qu'une par une, un aller-retour de CI à chaque fois.
      - run: cargo test --workspace --all-targets --no-fail-fast
      - name: Diagnostic
        run: cargo run -p zyr-cli -- doctor

  installateur:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NSIS n'est plus fourni par l'image Windows du runner, et son
      # installateur n'ajoute rien au PATH.
      - name: Installer NSIS
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - run: cargo build --release --workspace
      # Les guillemets ne sont pas décoratifs : sans eux, PowerShell coupe
      # -DVERSION=0.1.0 en deux arguments et makensis cherche un script
      # nommé « .1.0 ».
      - name: Construire l'installateur
        working-directory: packaging/windows
        run: makensis "-DVERSION=0.1.0" zyrdesk-setup.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: zyrdesk-setup
          path: packaging/windows/ZyrDesk-Setup-*.exe
          if-no-files-found: error
