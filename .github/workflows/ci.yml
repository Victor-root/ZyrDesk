name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: Format et analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  # Most of the engine (capture, hardware encoders, the player's drawing,
  # the service's sessions) only compiles on Windows: the analysis above
  # never sees it.
  quality-windows:
    name: Analyse statique (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The engine's tests run FFmpeg for real. Windows finds the build
      # kept in vendor/ffmpeg by itself; Linux gets its own, made by the
      # same script from the same sources, and made again only when the
      # script changes.
      - name: Retrouver FFmpeg pour Linux
        id: ffmpeg
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-linux-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - name: Compiler FFmpeg pour Linux
        if: runner.os == 'Linux' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm pkg-config make gcc git curl xz-utils
          bash packaging/ffmpeg/build.sh linux "$RUNNER_TEMP/ffmpeg"
      # Kept as soon as it is built: left to the end of the job, it would
      # be thrown away with every failing test and built again next time.
      - name: Garder FFmpeg pour Linux
        if: runner.os == 'Linux' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      # Without --no-fail-fast, cargo stops at the first failing test
      # binary: a platform that breaks several things only reveals them one
      # at a time, a CI round trip each time.
      - run: cargo test --workspace --all-targets --no-fail-fast
        env:
          ZYR_FFMPEG_DIR: ${{ runner.os == 'Linux' && format('{0}/ffmpeg/lib', runner.temp) || '' }}
      - name: Diagnostic
        run: cargo run -p zyr-cli -- doctor

  installer:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NSIS is no longer provided by the runner's Windows image, and its
      # installer adds nothing to the PATH.
      #
      # Asked for several times: the repository it comes from sometimes
      # answers "service unavailable", and a minute of outage on its side
      # passed for a defect on ours. The whole build went red on a commit
      # that did not touch the installer, which is the best way to stop
      # looking at the light at all.
      #
      # Where it lands is not known in advance: the package ships the 32
      # bit version one day and the 64 bit one the next, and the two do not
      # install in the same place. The path used to be written here by
      # hand, and the day the package switched sides, the build stopped on
      # a "makensis introuvable" although NSIS had just been installed.
      # Looked for rather than written, and said plainly when it is missing.
      - name: Installer NSIS
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $attempts) {
              throw "NSIS n'a pas pu être installé en $attempts essais"
            }
            Write-Host "NSIS non installé (essai $attempt sur $attempts), nouvel essai dans 20 s"
            Start-Sleep -Seconds 20
          }
          $found = Get-ChildItem -Path "C:\Program Files\NSIS", "C:\Program Files (x86)\NSIS" `
            -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { throw "makensis introuvable après l'installation de NSIS" }
          $found.DirectoryName >> $env:GITHUB_PATH
      - run: cargo build --release --workspace
      # The quotes are not decoration: without them, PowerShell splits
      # -DVERSION=0.1.0 into two arguments and makensis looks for a script
      # named ".1.0".
      - name: Construire l'installateur
        working-directory: packaging/windows
        run: makensis "-DVERSION=0.1.0" zyrdesk-setup.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: zyrdesk-setup
          path: packaging/windows/ZyrDesk-Setup-*.exe
          if-no-files-found: error
