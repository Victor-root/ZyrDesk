name: Serveur

# The server is built statically for Debian: one binary, with its
# fingerprint, that the install script downloads and checks. On every
# change to what it is made of, and, on a version tag, into a published
# release of the repository. A single architecture, x86_64, the one of
# Proxmox containers; other machines build on the spot (--from-source),
# which only costs a few minutes for this binary.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - ".github/workflows/serveur.yml"
      - "server/**"
      - "crates/zyr-broker/**"
      - "crates/zyr-proto/**"
      - "crates/zyr-transport/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  FILE_NAME: zyrdesk-server-x86_64-linux-musl

jobs:
  binary:
    name: zyrdesk-server (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
      # The embedded database and the encryption compile C code: musl-gcc
      # is the compiler of the static target.
      - name: Installer la chaîne musl
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Compiler
        run: cargo build --release -p zyr-server --target "$TARGET"
      - name: Nommer et signer d'une empreinte
        run: |
          set -euo pipefail
          mkdir -p published
          cp "target/$TARGET/release/zyrdesk-server" "published/$FILE_NAME"
          (cd published && sha256sum "$FILE_NAME" > "$FILE_NAME.sha256")
          "./published/$FILE_NAME" --version
      - uses: actions/upload-artifact@v7
        with:
          name: zyrdesk-server-x86_64
          path: published/
          if-no-files-found: error

  version:
    name: Version publiée
    needs: binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zyrdesk-server-*
          merge-multiple: true
          path: published/
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" published/* --clobber
          else
            gh release create "$tag" published/* \
              --title "ZyrDesk $tag" \
              --notes "Serveur ZyrDesk $tag : un binaire statique, avec son empreinte. Installation : bash <(curl -fsSL https://raw.githubusercontent.com/$GH_REPO/$tag/server/install.sh)"
          fi
