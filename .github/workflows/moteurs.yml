name: Moteurs

# The engines rarely move and building them takes long: the build does
# not run on every commit, only when what describes it changes, or on
# demand.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/moteurs.yml"
      - "packaging/engines/**"
      - ".gitmodules"
      - "engines/**"

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Moteur client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Only the client engine is needed here, and it already pulls its
          # own submodules during the build.
          submodules: false

      - name: Récupérer la source du moteur
        run: git submodule update --init --depth 1 engines/moonlight-qt

      # The Qt version is not a detail: it is the one the pinned version of
      # the engine is built and tested with upstream.
      #
      # No extra module is asked for: under Qt 6, everything the engine
      # uses (Quick, Controls, SVG) is already in the base installation,
      # and asking for it makes the installation fail instead of doing
      # nothing.
      - name: Installer Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The build checks what it produces itself: an engine missing a
      # library only shows at its first launch, on somebody else's
      # machine.
      - name: Compiler le moteur client
        run: ./packaging/engines/build-client-engine.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: zyrdesk-client-engine
          path: data/engines/client/
          if-no-files-found: error

  host:
    name: Moteur hôte
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          # Only the host engine is needed here, and it already pulls its
          # own submodules during the build.
          submodules: false

      - name: Récupérer la source du moteur
        shell: pwsh
        run: git submodule update --init --depth 1 engines/sunshine

      # The host engine does not build with Microsoft's compiler: its own
      # toolchain is GCC under MSYS2, and it is the one its pinned version
      # is built and tested with upstream. The list is its own, minus what
      # only serves its documentation and its installers, which we do not
      # produce.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      # The engine's configuration interface is built by a JavaScript tool,
      # which MSYS2 does not provide. The MSYS2 shell does not take over
      # the Windows PATH, otherwise its own tools would be hidden by their
      # Windows namesakes: the path to Node is therefore passed to it
      # explicitly.
      #
      # The version followed is the one the engine itself uses to build
      # that interface, not a number chosen here: that Node builds nothing
      # of ours. The engine asks for the current long-term support
      # version, so we do too.
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Relever le chemin de Node
        shell: pwsh
        run: |
          $folder = Split-Path -Parent (Get-Command node).Source
          "NODE_DIR=$folder" >> $env:GITHUB_ENV

      # The build checks what it produces itself: an engine missing a
      # library only shows at its first launch, on somebody else's
      # machine.
      - name: Compiler le moteur hôte
        run: |
          export PATH="${PATH}:$(cygpath "${NODE_DIR}")"
          ./packaging/engines/build-host-engine.sh

      - uses: actions/upload-artifact@v7
        with:
          name: zyrdesk-host-engine
          path: data/engines/host/
          if-no-files-found: error
