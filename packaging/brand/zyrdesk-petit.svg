<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ZyrDesk">
  <title>ZyrDesk</title>
  <!--
    La marque pour les très petites tailles : barre des tâches,
    gestionnaire des tâches, alt-tab.

    Le logo complet porte deux écrans qui se recouvrent, un dégradé par
    plan et un Z fin. En dessous de quarante pixels il ne reste de tout
    ça qu'une bouillie : les deux écrans se touchent, le Z passe sous le
    pixel et l'ensemble devient une tache. Réduire un dessin n'est pas
    le simplifier.

    Ce qui reste ici est ce qui survit : la plaque de sable, un seul
    écran doré, et un Z assez gras pour garder ses contre-formes. Les
    proportions sont calculées pour trente-deux pixels, où le trait du
    Z fait deux pixels et demi et les vides autant.
  -->
  <defs>
    <linearGradient id="zdp-sable" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2DDD6"/><stop offset="1" stop-color="#A69C90"/>
    </linearGradient>
    <linearGradient id="zdp-or" x1="12" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#zdp-sable)"/>

  <rect x="12" y="14" width="40" height="36" rx="6"
        fill="url(#zdp-or)" stroke="#7C3D0C" stroke-width="3"/>
  <path d="M20 22 H44 L20 42 H44" fill="none" stroke="#7C3D0C" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
