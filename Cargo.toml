[workspace]
resolver = "2"
members = [
    "crates/zyr-proto",
    "crates/zyr-engine-host",
    "crates/zyr-engine-client",
    "crates/zyr-transport",
    "crates/zyr-tunnel",
    "crates/zyr-control",
    "crates/zyr-session",
    "crates/zyr-lan",
    "crates/zyr-cli",
    "crates/zyr-ui",
    "crates/zyrdeskd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Victor-root/ZyrDesk"

[workspace.dependencies]
zyr-proto = { path = "crates/zyr-proto" }
zyr-engine-host = { path = "crates/zyr-engine-host" }
zyr-engine-client = { path = "crates/zyr-engine-client" }
zyr-transport = { path = "crates/zyr-transport" }
zyr-tunnel = { path = "crates/zyr-tunnel" }
zyr-control = { path = "crates/zyr-control" }
zyr-session = { path = "crates/zyr-session" }
zyr-lan = { path = "crates/zyr-lan" }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = "symbols"

# Le profil de développement sert aux essais de fonctionnement, où l'on
# recompile souvent et où seule la moitié qui bouge est la nôtre. Nos
# caisses restent donc non optimisées, pour compiler vite, mais tout ce
# qu'on ne touche jamais est optimisé une fois pour toutes.
#
# Sans cette ligne un essai en profil de développement n'aurait aucun
# sens : le chiffrement et le transport vivent dans ces dépendances, et
# non optimisés ils rendent une session inutilisable, ce qui ferait
# prendre un défaut de compilation pour un défaut de produit.
[profile.dev.package."*"]
opt-level = 2
