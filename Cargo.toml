[workspace]
resolver = "2"
members = [
    "crates/zyr-proto",
    "crates/zyr-engine-host",
    "crates/zyr-engine-client",
    "crates/zyr-transport",
    "crates/zyr-tunnel",
    "crates/zyr-clipboard",
    "crates/zyr-control",
    "crates/zyr-session",
    "crates/zyr-lan",
    "crates/zyr-broker",
    "crates/zyr-account",
    "crates/zyr-screen",
    "crates/zyr-sound",
    "crates/zyr-cli",
    "crates/zyr-ui",
    "crates/zyrdeskd",
    "server/zyr-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Victor-root/ZyrDesk"

[workspace.dependencies]
zyr-proto = { path = "crates/zyr-proto" }
zyr-engine-host = { path = "crates/zyr-engine-host" }
zyr-engine-client = { path = "crates/zyr-engine-client" }
zyr-transport = { path = "crates/zyr-transport" }
zyr-tunnel = { path = "crates/zyr-tunnel" }
zyr-clipboard = { path = "crates/zyr-clipboard" }
zyr-control = { path = "crates/zyr-control" }
zyr-session = { path = "crates/zyr-session" }
zyr-lan = { path = "crates/zyr-lan" }
zyr-broker = { path = "crates/zyr-broker" }
zyr-account = { path = "crates/zyr-account" }
zyr-screen = { path = "crates/zyr-screen" }
zyr-sound = { path = "crates/zyr-sound" }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = "symbols"

# The development profile is for trying things out, where we recompile
# often and only the half that moves is ours. Our crates therefore stay
# unoptimised, to compile quickly, but everything we never touch is
# optimised once and for all.
#
# Without this line a trial in the development profile would mean
# nothing: encryption and transport live in these dependencies, and
# unoptimised they make a session unusable, which would pass a build
# setting off as a product defect.
[profile.dev.package."*"]
opt-level = 2
