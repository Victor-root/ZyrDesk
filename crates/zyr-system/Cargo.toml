[package]
name = "zyr-system"
description = "What ZyrDesk asks of Windows itself: the session that holds the screen, what is started there, and what gets a program running at all"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true

[target.'cfg(windows)'.dependencies]
zyr-win32.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # The colour of the desktop, behind its wallpaper.
    "Win32_Graphics_Gdi",
    # Timers to the millisecond while a session is open.
    "Win32_Media",
    # What the network stack and the cards have counted, and which card
    # reaches an address.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # The Wi-Fi's types only: its functions are looked for at run time,
    # wlanapi.dll being missing from a Windows Server without its
    # wireless service.
    "Win32_NetworkManagement_WiFi",
    # The full name written on this computer for an account.
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    # The name a company's directory gives the person.
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    # The shell asked to run a program with administrator rights expects
    # COM on the thread that asks.
    "Win32_System_Com",
    # Every program running, for how much of the processor each one uses.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    # The power plan and whether the mains is on.
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    # How much memory the computer has.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # The hour on this computer's clock, summer time included.
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    # The one verb that raises the administrator prompt.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
