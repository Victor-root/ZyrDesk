[package]
name = "zyr-proto"
description = "Types and constants shared between the ZyrDesk components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# What a clipboard holds travels on a text channel, and a picture is not
# text: these two are already in the repository's lock file, the first
# through the accounts and the second through the transport.
base64 = "0.23.1"
if-addrs = "0.15.0"
rand = "0.10.3"
sha2 = "0.11.0"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "macros"] }
