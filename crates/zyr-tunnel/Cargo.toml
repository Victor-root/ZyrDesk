[package]
name = "zyr-tunnel"
description = "Carrying the engine's local link, and ZyrDesk's own questions, in a single connection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# A piece of a file travels on a text channel, and bytes are not text:
# the same crate as the one that carries pictures, already in the
# repository's lock file.
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
zyr-control.workspace = true
zyr-proto.workspace = true
zyr-transport.workspace = true
