[package]
name = "zyr-tunnel"
description = "Multiplexage des flux des moteurs dans une connexion unique"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Un morceau de fichier voyage sur un canal de texte, et des octets n'en
# sont pas : la même caisse que celle qui porte les images, déjà dans le
# verrou du dépôt.
base64 = "0.23.1"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync"] }
zyr-proto.workspace = true
zyr-transport.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }
