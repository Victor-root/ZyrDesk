[package]
name = "zyr-tunnel"
description = "Multiplexing of the engines' streams into a single connection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# A piece of a file travels on a text channel, and bytes are not text:
# the same crate as the one that carries pictures, already in the
# repository's lock file.
base64 = "0.23.1"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync"] }
zyr-proto.workspace = true
zyr-transport.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }
