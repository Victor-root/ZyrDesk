[package]
name = "zyr-sound"
description = "The computer's sound: muting one program, muting the speakers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows audio family exists only as COM, and windows-sys carries no
# COM interface: it only knows functions, structures and constants.
# Writing those interfaces by hand would mean copying function tables that
# nothing checks. The windows package comes from the same publisher, it is
# already in the repository's lock file (the interface uses it), and the
# compiler checks every call there.
windows = { version = "0.61.3", features = [
    "Win32_Media_Audio",
    # The speakers' mute, which is a property of the device and not of
    # the mix: that is why it does not reach the capture.
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    # IMMDevice::Activate takes a PROPVARIANT parameter, even unused:
    # without these two features, the method is not compiled.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
