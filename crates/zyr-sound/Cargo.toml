[package]
name = "zyr-sound"
description = "Le son de l'ordinateur : couper celui d'un programme, couper celui des enceintes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
# La famille audio de Windows n'existe qu'en COM, et windows-sys ne
# porte aucune interface COM : il ne connaît que des fonctions, des
# structures et des constantes. Écrire ces interfaces à la main
# reviendrait à recopier des tables de fonctions que rien ne vérifie.
# Le paquet windows est du même éditeur, il est déjà dans le verrou du
# dépôt (l'interface s'en sert), et le compilateur y contrôle chaque appel.
windows = { version = "0.61.3", features = [
    "Win32_Media_Audio",
    # Le muet des enceintes, qui est une propriété du périphérique et
    # non du mélange : c'est ce qui fait qu'il n'atteint pas la capture.
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    # IMMDevice::Activate porte un paramètre PROPVARIANT, même
    # inutilisé : sans ces deux portes, la méthode n'est pas compilée.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
