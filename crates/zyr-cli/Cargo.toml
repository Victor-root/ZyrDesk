[package]
name = "zyr-cli"
# Ce que le gestionnaire des tâches affiche. Sans accent : le compilateur
# de ressources de Windows lit ce nom dans le jeu de caractères du
# système, et une lettre accentuée y arrive coupée.
description = "ZyrDesk : l'outil en ligne de commande"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true
zyr-engine-host.workspace = true
zyr-engine-client.workspace = true
zyr-transport.workspace = true
zyr-tunnel.workspace = true
zyr-control.workspace = true
zyr-session.workspace = true
clap.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
