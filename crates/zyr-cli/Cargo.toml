[package]
name = "zyr-cli"
# What the Task Manager shows. No accents: the Windows resource compiler
# reads this name in the system's character set, and an accented letter
# arrives there cut in two.
description = "ZyrDesk : Outil en ligne de commande"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true
zyr-engine-host.workspace = true
zyr-engine-client.workspace = true
zyr-transport.workspace = true
zyr-tunnel.workspace = true
zyr-control.workspace = true
zyr-session.workspace = true
zyr-broker.workspace = true
clap.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
