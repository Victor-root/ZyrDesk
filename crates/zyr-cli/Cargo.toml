[package]
name = "zyr-cli"
# What the Task Manager shows. No accents: the Windows resource compiler
# reads this name in the system's character set, and an accented letter
# arrives there cut in two.
description = "ZyrDesk : Outil en ligne de commande"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true
zyr-codec.workspace = true
zyr-player.workspace = true
zyr-transport.workspace = true
zyr-tunnel.workspace = true
zyr-control.workspace = true
zyr-session.workspace = true
zyr-broker.workspace = true
clap.workspace = true
# The bench's echoes ask for socket buffers sized for a video stream,
# which tokio's own sockets cannot. The version the transport already
# uses.
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
# The encoders the diagnosis tries, the way the host engine tries them.
zyr-host.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_System_Threading"] }
