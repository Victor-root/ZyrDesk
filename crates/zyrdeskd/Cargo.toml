[package]
name = "zyrdeskd"
# What the Task Manager shows. No accents: the Windows resource compiler
# reads this name in the system's character set, and an accented letter
# arrives there cut in two.
description = "ZyrDesk: Remote connection service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true
zyr-host.workspace = true
zyr-media.workspace = true
zyr-clipboard.workspace = true
zyr-transport.workspace = true
zyr-tunnel.workspace = true
zyr-control.workspace = true
zyr-link.workspace = true
zyr-lan.workspace = true
zyr-screen.workspace = true
zyr-sound.workspace = true
zyr-system.workspace = true
zyr-win32.workspace = true
zyr-broker.workspace = true
zyr-account.workspace = true
clap.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[dev-dependencies]
# The account link is tried against a real server, in the same process,
# with a certificate nobody vouches for: the road of every self-hosted
# server.
zyr-server = { path = "../../server/zyr-server" }
rcgen = "0.14.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
