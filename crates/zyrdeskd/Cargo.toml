[package]
name = "zyrdeskd"
# What the Task Manager shows. No accents: the Windows resource compiler
# reads this name in the system's character set, and an accented letter
# arrives there cut in two.
description = "ZyrDesk: Remote connection service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true
zyr-host.workspace = true
zyr-service.workspace = true
zyr-lan.workspace = true
zyr-screen.workspace = true
zyr-system.workspace = true
clap.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
