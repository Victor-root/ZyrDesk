[package]
name = "zyrdeskd"
# Ce que le gestionnaire des tâches affiche. Sans accent : le compilateur
# de ressources de Windows lit ce nom dans le jeu de caractères du
# système, et une lettre accentuée y arrive coupée.
description = "ZyrDesk : Service de connexion distante"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true
zyr-engine-host.workspace = true
zyr-transport.workspace = true
zyr-tunnel.workspace = true
zyr-control.workspace = true
zyr-lan.workspace = true
zyr-screen.workspace = true
zyr-sound.workspace = true
zyr-broker.workspace = true
zyr-account.workspace = true
clap.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[dev-dependencies]
# Le lien de compte s'essaie contre un vrai serveur, dans le même
# processus, avec un certificat que personne ne garantit : la route de
# tout serveur auto-hébergé.
zyr-server = { path = "../../server/zyr-server" }
rcgen = "0.14.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }
