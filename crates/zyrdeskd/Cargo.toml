[package]
name = "zyrdeskd"
description = "Service ZyrDesk : accès distant avant ouverture de session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true
zyr-engine-host.workspace = true
zyr-transport.workspace = true
zyr-tunnel.workspace = true
zyr-control.workspace = true
zyr-lan.workspace = true
zyr-screen.workspace = true
clap.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
