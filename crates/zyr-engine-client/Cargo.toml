[package]
name = "zyr-engine-client"
description = "Supervision du moteur client : état par appareil, lancement de session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true

[target.'cfg(windows)'.dependencies]
# Un moteur ne survit pas au programme qui l'a lancé, et Windows ne
# l'assure pas tout seul : il faut le lui demander.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    # CreateJobObjectW prend des attributs de sécurité, et windows-sys
    # range donc toute la fonction derrière cette porte-là.
    "Win32_Security",
] }
