[package]
name = "zyr-engine-client"
description = "Supervision of the client engine: per-device state, session launch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true

[target.'cfg(windows)'.dependencies]
# An engine does not outlive the program that launched it, and Windows
# does not see to that on its own: it has to be asked.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    # CreateJobObjectW takes security attributes, so windows-sys files
    # the whole function behind this feature.
    "Win32_Security",
] }
