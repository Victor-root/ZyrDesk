[package]
name = "zyr-clipboard"
description = "The computer's clipboard: what it holds, what it is given"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zyr-proto.workspace = true

[target.'cfg(windows)'.dependencies]
# The clipboard itself is only a handful of functions, but the imaging
# that turns a screenshot into a PNG exists only as COM, and `windows-sys`
# carries no COM interface. The `windows` package describes them all, it
# is already in the repository's lock file (the interface and the sound
# use it), and taking both halves from the same place avoids having two
# names for one HANDLE.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # WIC, the imaging of Windows: only it can make a PNG out of a
    # screenshot without bundling an encoder.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    # The in-memory stream the encoder writes into.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # What it takes to name the attributes of an ordinary file, to
    # describe the ones held on behalf of the other computer.
    "Win32_Storage_FileSystem",
    # CF_UNICODETEXT and CF_DIB, which windows files with OLE, and the
    # OLE clipboard itself, the only one able to stand in for files that
    # are not there yet.
    "Win32_System_Ole",
    # What a drag and drop and a copy in Explorer put on the clipboard: a
    # handful of paths, read by the shell family.
    "Win32_UI_Shell",
    # The message queue of the thread that holds the clipboard for the
    # other programs: without reading it, their questions go unanswered
    # and their paste waits for nothing.
    "Win32_UI_WindowsAndMessaging",
] }
# What the macro that builds a COM object writes: it names this crate by
# its own name, and does not find it under the family's. It is the same
# one, republished by `windows`, already in the repository's lock file.
windows-core = "0.61.2"
