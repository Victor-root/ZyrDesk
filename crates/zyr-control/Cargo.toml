[package]
name = "zyr-control"
description = "Command channel of the ZyrDesk service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "rt"] }
zyr-proto.workspace = true
zyr-broker.workspace = true

# The command channel is a named pipe on Windows, made the way every pipe
# of the product is made.
[target.'cfg(windows)'.dependencies]
zyr-link.workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
