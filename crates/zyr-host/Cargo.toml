[package]
name = "zyr-host"
description = "Host side of the ZyrDesk engine: capture, encoding, input and sound of the computer being shown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Stand-ins for the screen, the keyboard and mouse and the sound card, so
# that the whole engine runs anywhere: this crate's tests use them, and so
# do the end-to-end tests of the crates that drive the engine.
fake = []

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
zyr-codec.workspace = true
zyr-control.workspace = true
zyr-media.workspace = true
zyr-proto.workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
