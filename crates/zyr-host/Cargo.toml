[package]
name = "zyr-host"
description = "Host side of the ZyrDesk engine: capture, encoding, input and sound of the computer being shown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Stand-ins for the screen, the keyboard and mouse and the sound card, so
# that the whole engine runs anywhere: this crate's tests use them, and so
# do the end-to-end tests of the crates that drive the engine.
fake = []

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
zyr-codec.workspace = true
zyr-control.workspace = true
zyr-media.workspace = true
zyr-proto.workspace = true

[target.'cfg(windows)'.dependencies]
# The screen's own name, as the rest of the product knows it.
zyr-screen.workspace = true
# Desktop Duplication, Direct3D 11, WASAPI and SendInput are COM or need
# its types: windows-sys carries no COM interface. The version the rest
# of the repository already uses.
windows = { version = "0.62.2", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    # NVIDIA's own library, found at run time.
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
