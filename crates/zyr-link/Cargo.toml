[package]
name = "zyr-link"
description = "Local link between a ZyrDesk engine and the service, and the plumbing of the product's named pipes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
tokio = { version = "1.53.1", features = ["net", "io-util", "time"] }
zyr-proto.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
