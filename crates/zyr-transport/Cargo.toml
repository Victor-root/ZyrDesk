[package]
name = "zyr-transport"
description = "ZyrDesk transport: packet budget, media congestion control, encrypted tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.11.1"
quinn = "0.11.11"
# Held at this version: 0.11.17 subtracts twice the size of a datagram
# dropped from the send queue, whose bookkeeping goes below zero as soon
# as the queue overflows once. The transport then starts sending from a
# queue whose size it no longer knows, then panics in the middle of a
# send, which kills the session without a word. The zyr-transport burst
# test proves it. To be raised once the fix is published.
quinn-proto = "=0.11.16"
rcgen = "0.14.8"
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103.13", features = ["ring"] }
sha2 = "0.11.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync"] }
webpki-roots = "1"
zyr-proto.workspace = true
