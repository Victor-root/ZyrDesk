<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ZyrDesk</title>
    <link rel="stylesheet" href="design.css" />
    <link rel="stylesheet" href="bouton.css" />
    <!-- Comme l'accueil : le thème est posé avant le premier affichage. -->
    <script src="theme.js"></script>
  </head>
  <body class="flottant">
    <div class="paquet" id="paquet">
      <button
        class="logo"
        id="logo"
        aria-label="Menu de la session"
        aria-haspopup="menu"
        aria-expanded="false"
      >
        <!-- Une image se traîne toute seule sous Windows, et le
             curseur passait au sens interdit dès qu'on prenait le
             bouton : le système croyait à un glisser-déposer. -->
        <img
          src="zyrdesk.svg"
          alt=""
          width="44"
          height="44"
          draggable="false"
        />
      </button>

      <div class="menu repliee" id="menu" role="menu">
        <!-- Ce que la session coûte à l'instant. Rempli au fil de
             l'ouverture par ce que le moteur écrit une fois par seconde :
             les chiffres et leurs mots vivent dans le script, une seule
             fois, plutôt qu'une deuxième copie ici qui s'écarterait de la
             vraie au premier changement. -->
        <div class="mesures" id="mesures" role="status">
          <div class="chiffres" id="chiffres"></div>
          <p class="flux" id="flux"></p>
        </div>

        <div class="separateur" role="separator"></div>

        <button
          class="item"
          type="button"
          data-acte="fullscreen"
          role="menuitem"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3" />
            <path d="M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" />
          </svg>
          <span class="item-mot">Fenêtré ou plein écran</span>
          <!-- Rempli au chargement, comme celui du bas : c'est la fenêtre
               de ZyrDesk qui bascule maintenant, et son raccourci se
               choisit dans les réglages. -->
          <span class="item-touche" id="touche-plein-ecran"></span>
        </button>

        <button class="item" type="button" data-acte="stats" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 20V10M9 20V4M15 20v-7M21 20V8" />
          </svg>
          <span class="item-mot">Statistiques</span>
          <span class="item-touche">Ctrl+Alt+Maj+S</span>
        </button>

        <!-- Un interrupteur et non une bascule aveugle. « Souris bureau
             ou jeu » disait ce que le clic ferait et jamais où l'on en
             était, et les deux modes ne se distinguent pas à l'oeil sur
             un bureau immobile : on cliquait pour voir, ce qui est la
             définition d'un réglage qu'on ne comprend pas. Les deux mots
             sont là, celui qui est en place est allumé. -->
        <div class="item item-avec-choix" role="group" aria-label="Souris">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="2.5" width="10" height="19" rx="5" />
            <path d="M12 7v3" />
          </svg>
          <span class="item-mot">Souris</span>
          <div class="bascule" id="souris">
            <button
              class="bascule-cote"
              type="button"
              data-souris="bureau"
              role="menuitemradio"
              aria-checked="false"
            >
              Bureau
            </button>
            <button
              class="bascule-cote"
              type="button"
              data-souris="jeu"
              role="menuitemradio"
              aria-checked="false"
            >
              Jeu
            </button>
          </div>
        </div>

        <!-- Le son de la session, coupé ici et pas là-bas : l'ordinateur
             d'en face continue de jouer ce qu'il joue, et c'est le
             silence de cette pièce-ci qu'on demande. Même interrupteur
             que la souris, parce que c'est la même question : lequel des
             deux est en place. -->
        <div class="item item-avec-choix" role="group" aria-label="Son">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6.5 9H3v6h3.5L11 19z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
          </svg>
          <span class="item-mot">Son</span>
          <div class="bascule" id="son">
            <button
              class="bascule-cote"
              type="button"
              data-son="actif"
              role="menuitemradio"
              aria-checked="false"
            >
              Actif
            </button>
            <button
              class="bascule-cote"
              type="button"
              data-son="coupe"
              role="menuitemradio"
              aria-checked="false"
            >
              Coupé
            </button>
          </div>
        </div>

        <!-- Les trois touches que Windows garde pour lui aux deux bouts
             d'une session : cet ordinateur-ci ne les voit jamais, son
             propre Windows les prend avant tout programme, et l'image
             ne peut pas les faire sentir là-bas. Elles voyagent donc par
             le canal du produit, et c'est le service d'en face qui les
             presse sur sa machine. -->
        <button class="item" type="button" data-acte="cad" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="6" width="19" height="12" rx="2" />
            <path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M6 14h12" />
          </svg>
          <span class="item-mot">Ctrl+Alt+Suppr</span>
          <span class="item-touche">sur l'ordinateur distant</span>
        </button>

        <div class="separateur" role="separator"></div>

        <!-- Les trois nombres qu'on règle en regardant l'image qu'ils
             changent. Un curseur qu'on pousse le long de la barre, et la
             valeur écrite au-dessus.

             Un curseur plutôt qu'une liste qui s'ouvre sur le côté. Ces
             trois-là sont des échelles : plus grand, plus rapide, et on
             en cherche le bon cran en regardant l'image bouger. Une liste
             demandait un clic pour l'ouvrir, un pour choisir, cachait ce
             qu'il y avait au-dessus et au-dessous de la valeur en place,
             et faisait de la fenêtre un objet plus large que le menu pour
             loger ce qui s'en échappait par la gauche.

             Les crans viennent du produit : le curseur va de zéro au
             nombre de valeurs moins une, et ce que chaque cran veut dire
             est écrit à côté. Une seconde copie de ces listes ici
             s'écarterait de la vraie au premier changement. -->
        <div class="reglage" data-reglage="asked">
          <div class="reglage-tete">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2.5" y="4" width="19" height="13" rx="2" />
              <path d="M9 21h6M12 17v4" />
            </svg>
            <span class="item-mot">Taille</span>
            <span class="item-touche" data-valeur></span>
          </div>
          <input
            class="curseur"
            type="range"
            data-curseur
            aria-label="Taille"
          />
        </div>

        <div class="reglage" data-reglage="bitrate">
          <div class="reglage-tete">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12h3l3-7 4 14 3-7h5" />
            </svg>
            <span class="item-mot">Débit</span>
            <span class="item-touche" data-valeur></span>
          </div>
          <input class="curseur" type="range" data-curseur aria-label="Débit" />
        </div>

        <!-- Des boutons et non une barre : le codec n'est pas une
             échelle. Ce sont quelques noms sans ordre entre eux, dont un
             « Automatique » qui n'est pas une valeur mais un
             renoncement ; pousser un curseur promettait un plus et un
             moins qui n'existent pas. Ils sont bâtis par le script,
             depuis la liste que le produit tient : une deuxième copie
             ici s'en écarterait au premier codec ajouté. -->
        <div
          class="item item-avec-choix"
          role="group"
          aria-label="Codec"
          data-reglage="codec"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="2" />
            <path
              d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"
            />
          </svg>
          <span class="item-mot">Codec</span>
          <div class="bascule"></div>
        </div>

        <!-- Ce qui a été choisi n'est pas encore ce qui est à l'écran :
             l'image a été ouverte avec d'autres nombres, et le moteur ne
             les apprend qu'au démarrage. La ligne n'apparaît qu'à ce
             moment-là, ce qui permet d'en changer plusieurs et de ne
             relancer l'image qu'une fois. -->
        <button
          class="item appliquer cache"
          type="button"
          data-appliquer
          role="menuitem"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11A8 8 0 0 0 6.3 6.3L3 9.5" />
            <path d="M4 13a8 8 0 0 0 13.7 4.7L21 14.5" />
            <path d="M3 4.5v5h5M21 19.5v-5h-5" />
          </svg>
          <span class="item-mot">Appliquer les changements</span>
          <span class="item-touche">relance l'image</span>
        </button>

        <div class="separateur" role="separator"></div>

        <button class="item" type="button" data-cacher role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10.6 6.2A9.9 9.9 0 0 1 12 6c5 0 9 4.5 10 6a15 15 0 0 1-3 3.6M6.1 8.3C4.4 9.5 3.3 11 3 12c1 1.5 5 6 9 6a9.6 9.6 0 0 0 3.6-.7"
            />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18" />
          </svg>
          <span class="item-mot">Masquer ce bouton</span>
          <!-- Rempli au chargement par le raccourci réellement en place :
               masquer sans dire comment revenir serait sans retour. -->
          <span class="item-touche" id="retour"></span>
        </button>

        <!-- Une seule façon de finir. Les moteurs en offrent deux, dont
             une qui laisse le bureau distant ouvert et en attente : ce
             serait une session ni en cours ni terminée, et personne n'a
             demandé ce troisième état. -->
        <button
          class="item quitter"
          type="button"
          data-acte="end"
          role="menuitem"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v9" />
            <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
          </svg>
          <span class="item-mot">Terminer la session</span>
          <!-- Rempli au chargement : c'est notre raccourci et il se
               choisit dans les réglages. -->
          <span class="item-touche" id="touche-fin"></span>
        </button>

        <p class="souci cache" id="souci" role="status"></p>
      </div>
    </div>

    <script src="touches.js"></script>
    <script src="bouton.js"></script>
  </body>
</html>
