<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ZyrDesk">
  <title>ZyrDesk</title>
  <!--
    Deux écrans qui se chevauchent en diagonale, et un Z qui les relie :
    c'est ce que le produit fait, dit en un dessin. Celui du fond est
    doré, celui de devant argenté, et le Z part de l'un pour entrer dans
    l'autre.

    Tout est en trait sur une plaque noire, et rien n'est rempli : c'est
    le contraste du trait clair sur le fond sombre qui porte le dessin, y
    compris réduit à seize pixels où il ne reste que trois masses.

    L'ordre de dessin fait tout le reste. Le Z est posé sur l'écran de
    devant avec un liseré de la couleur de la plaque, qui l'en détache
    nettement ; l'écran du fond est posé sur le Z, et comme ils sont de la
    même couleur, la barre du haut du Z devient le bord bas de cet
    écran-là. Un seul trait au lieu de deux qui se frôlent, ce qui est la
    seule façon que ça reste lisible en petit.
  -->
  <defs>
    <linearGradient id="zd-or" x1="12" y1="12" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7DB92"/><stop offset="1" stop-color="#D6A03C"/>
    </linearGradient>
    <linearGradient id="zd-argent" x1="29" y1="37" x2="52" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F8FC"/><stop offset="1" stop-color="#C3C8D5"/>
    </linearGradient>
    <linearGradient id="zd-plaque" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15161D"/><stop offset="1" stop-color="#07070B"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#zd-plaque)"/>
  <!-- Sans ce liseré la plaque se fond dans une barre des tâches sombre
       et l'icône n'a plus de bord du tout ; plus clair ou plus épais, il
       devient à seize pixels un halo gris qui mange le dessin. -->
  <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="13.4" fill="none"
        stroke="#2C2E38" stroke-width="1.2"/>

  <rect x="28.5" y="37.5" width="24" height="13.5" rx="2.8" fill="none"
        stroke="url(#zd-argent)" stroke-width="3"/>

  <path d="M20 26.5 H41.5 L22.5 45 H39.5" fill="none" stroke="#0A0A0F" stroke-width="8.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 26.5 H41.5 L22.5 45 H39.5" fill="none" stroke="url(#zd-or)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="11.5" y="13" width="24" height="13.5" rx="2.8" fill="none"
        stroke="url(#zd-or)" stroke-width="3"/>
</svg>
