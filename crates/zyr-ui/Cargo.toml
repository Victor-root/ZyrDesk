[package]
name = "zyr-ui"
# What the Task Manager shows. No accents: the Windows resource compiler
# reads this name in the system's character set, and an accented letter
# arrives there cut in two.
description = "ZyrDesk : Application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The product's name, not the crate's: it is what the person reads in
# the taskbar and in the Task Manager.
[[bin]]
name = "ZyrDesk"
path = "src/main.rs"

[build-dependencies]
# The program's Windows resource: its manifest, which asks for the
# system's modern controls and says this program counts in real pixels,
# and its icon, the one the taskbar draws.
embed-resource = "3.0.11"

[dependencies]
zyr-proto.workspace = true
zyr-clipboard.workspace = true
zyr-control.workspace = true
zyr-session.workspace = true
zyr-sound.workspace = true
zyr-transport.workspace = true
zyr-broker.workspace = true
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
] }

[target.'cfg(windows)'.dependencies]
# Drawing the interface: Direct2D and DirectWrite, provided by Windows
# itself, so nothing is bundled. They are COM objects, which `windows-sys`
# cannot describe and `windows` does: both crates are of the same family,
# and this one is already in the project's lock file, pulled in by the
# sound crate.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_WindowsAndMessaging",
] }
# The points and matrices Direct2D uses: a separate crate of the family,
# already in the project's lock file since `windows` depends on it.
windows-numerics = "0.3.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # Rounded window corners belong to the compositor, and it is the one
    # asked not to round them for the length of a session.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # PrintWindow, the only copy of a window that reaches what a program
    # draws on the graphics card. windows-sys files it with printing,
    # hence this feature.
    "Win32_Storage_Xps",
    "Win32_System_Com",
    # SHELLEXECUTEINFOW holds a registry field, so windows-sys files the
    # whole ShellExecuteEx family behind this feature.
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    # GetTickCount: the only clock that speaks the same language as the
    # timestamp Windows puts on every key press, so the only one that
    # tells a key's age when it arrives.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # SetWinEventHook: being told by Windows where the foreground goes,
    # instead of asking it again and again. Filed with accessibility,
    # which is what these hooks were first made for.
    "Win32_UI_Accessibility",
    # WM_MOUSELEAVE, without which nothing ever says a hand has left the
    # logo: windows-sys files it with the controls.
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
