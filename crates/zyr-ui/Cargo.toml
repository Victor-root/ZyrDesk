[package]
name = "zyr-ui"
description = "Application ZyrDesk : la seule fenêtre que l'utilisateur voit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Le nom du produit, pas celui de la caisse : c'est ce que la personne
# lit dans la barre des tâches et dans le gestionnaire des tâches.
[[bin]]
name = "ZyrDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zyr-proto.workspace = true
zyr-control.workspace = true
zyr-session.workspace = true
zyr-sound.workspace = true
zyr-transport.workspace = true
# La zone de notification est la seule trace que ZyrDesk laisse quand sa
# fenêtre est fermée : sans elle, un produit qui rend la machine
# joignable tournerait sans que rien ne le dise.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }

[target.'cfg(windows)'.dependencies]
# Un seul ZyrDesk à la fois : deux programmes voudraient dire deux
# boutons flottants sur la même session. Le produit ne tourne que sous
# Windows, et la dépendance n'est tirée que là.
tauri-plugin-single-instance = "2"
# Le dessin de l'interface : Direct2D et DirectWrite, fournis par Windows
# lui-même, donc rien n'est embarqué. Ce sont des objets COM, que
# `windows-sys` ne sait pas décrire et que `windows` décrit : les deux
# caisses sont de la même famille et celle-ci est déjà dans le verrou du
# projet, tirée par la boîte à outils.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_WindowsAndMessaging",
] }
# Les points et les matrices que Direct2D emploie : une caisse à part de
# la famille, déjà dans le verrou du projet puisque `windows` en dépend.
windows-numerics = "0.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # Les coins arrondis des fenêtres appartiennent au compositeur, et
    # c'est à lui qu'on demande de ne pas les arrondir le temps d'une
    # session.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # PrintWindow, la seule copie d'une fenêtre qui atteigne ce qu'un
    # programme dessine sur la carte graphique. Rangée par windows-sys
    # avec l'impression, d'où cette porte-là.
    "Win32_Storage_Xps",
    "Win32_System_Com",
    # Copier au presse-papiers : le geste est rangé par windows-sys avec
    # les échanges entre programmes, le format du texte avec l'OLE, et la
    # mémoire qu'on remet au système avec la mémoire.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # SHELLEXECUTEINFOW porte un champ de registre, et windows-sys range
    # donc toute la famille ShellExecuteEx derrière cette porte-là.
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    # GetTickCount : la seule horloge qui parle la même langue que
    # l'horodatage que Windows colle sur chaque frappe, donc la seule qui
    # dise l'âge d'une touche en arrivant.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # SetWinEventHook : se faire dire par Windows où passe le premier
    # plan, au lieu de le lui redemander sans arrêt. Rangé avec
    # l'accessibilité, qui est l'usage d'origine de ces crochets.
    "Win32_UI_Accessibility",
    # WM_MOUSELEAVE, sans quoi rien ne dit jamais qu'une main a quitté le
    # logo : windows-sys le range avec les contrôles.
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
