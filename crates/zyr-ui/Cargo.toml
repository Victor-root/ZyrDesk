[package]
name = "zyr-ui"
# What the Task Manager shows. No accents: the Windows resource compiler
# reads this name in the system's character set, and an accented letter
# arrives there cut in two.
description = "ZyrDesk: Application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The product's name, not the crate's: it is what the person reads in
# the taskbar and in the Task Manager.
[[bin]]
name = "ZyrDesk"
path = "src/main.rs"

[build-dependencies]
# The program's Windows resource: its manifest, which asks for the
# system's modern controls and says this program counts in real pixels,
# and its icon, the one the taskbar draws.
embed-resource = "3.0.11"

[dependencies]
zyr-proto.workspace = true
# What the person reads, in their language.
zyr-i18n.workspace = true
zyr-clipboard.workspace = true
# What every window of this program is painted with.
zyr-draw.workspace = true
zyr-control.workspace = true
# The player of a session, which draws its picture into a window of
# ours and hears its keyboard and mouse from there.
zyr-player.workspace = true
zyr-session.workspace = true
zyr-broker.workspace = true
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
] }

[target.'cfg(windows)'.dependencies]
zyr-win32.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # The languages the person reads Windows in, which choose the words.
    "Win32_Globalization",
    # Rounded window corners belong to the compositor, and it is the one
    # asked not to round them for the length of a session.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # SHELLEXECUTEINFOW holds a registry field, so windows-sys files the
    # whole ShellExecuteEx family behind this feature.
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    # MK_LBUTTON and the other buttons a mouse message says are down.
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # WM_MOUSELEAVE, without which nothing ever says a hand has left the
    # logo: windows-sys files it with the controls.
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    # The mouse read from the device itself, for a game.
    "Win32_UI_Input",
    # No input method composing over the picture: the far computer's does.
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
