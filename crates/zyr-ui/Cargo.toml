[package]
name = "zyr-ui"
description = "Application ZyrDesk : la seule fenêtre que l'utilisateur voit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Le nom du produit, pas celui de la caisse : c'est ce que la personne
# lit dans la barre des tâches et dans le gestionnaire des tâches.
[[bin]]
name = "ZyrDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zyr-proto.workspace = true
zyr-control.workspace = true
zyr-session.workspace = true
zyr-transport.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }

[target.'cfg(windows)'.dependencies]
# Un seul ZyrDesk à la fois : deux programmes voudraient dire deux
# boutons flottants sur la même session. Le produit ne tourne que sous
# Windows, et la dépendance n'est tirée que là.
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    # SHELLEXECUTEINFOW porte un champ de registre, et windows-sys range
    # donc toute la famille ShellExecuteEx derrière cette porte-là.
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
