[package]
name = "zyr-server"
description = "ZyrDesk: server of accounts, introductions and relays"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true

[[bin]]
name = "zyrdesk-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap.workspace = true
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.1.6"
zyr-broker.workspace = true
zyr-proto.workspace = true
zyr-transport.workspace = true

[dev-dependencies]
futures-util = "0.3.34"
rcgen = "0.14.10"
tokio-tungstenite = "0.30.0"
ureq = { version = "3.4.2", features = ["json"] }
